<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برطمان القلوب والرسائل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; color: #4a4a4a; overflow-x: hidden; }
        .container { max-width: 450px; width: 100%; position: relative; }
        h1 { color: #e91e63; margin-bottom: 5px; font-size: 2rem; }
        p.subtitle { color: #888; margin-bottom: 25px; font-size: 0.95rem; }
        
        .jar-wrapper { 
            position: relative; 
            width: 210px; 
            height: 310px; 
            margin: 0 auto 30px; 
            cursor: pointer; 
            z-index: 10; 
        }

        .shake-jar { animation: shake 0.5s ease-in-out; }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg) translateY(-4px); }
            40% { transform: rotate(8deg) translateY(4px); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        /* البرطمان الزجاجي */
        .glass-jar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.4) 100%);
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px 20px 60px 60px;
            box-shadow: 0 20px 30px rgba(233, 30, 99, 0.12), inset 0 0 25px rgba(255,255,255,0.9);
            position: relative;
            backdrop-filter: blur(2px);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .jar-cap {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 32px;
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 50%, #b0b0b0 100%);
            border-radius: 6px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 15;
        }

        .glass-shine {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 20px;
            height: 80%;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 10px;
            z-index: 12;
            pointer-events: none;
        }

        /* القلوب المتراكمة */
        .jar-contents {
            width: 100%;
            height: 82%;
            z-index: 5;
            position: relative;
            overflow: hidden;
        }

        .stacked-heart {
            position: absolute;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.25));
            transition: transform 0.3s ease;
        }

        /* القلب المستخرج والمتحرك */
        .popped-container {
            display: none;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer;
            z-index: 30;
            text-align: center;
        }

        .popped-container.show {
            display: block;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: translate(-50%, 40px) scale(0.2); opacity: 0; }
            100% { transform: translate(-50%, -100px) scale(1); opacity: 1; }
        }

        /* القلب المنفتح */
        .interactive-heart {
            width: 90px;
            height: 90px;
            position: relative;
            margin: 0 auto 10px;
            perspective: 1000px;
        }

        .heart-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .heart-base { z-index: 1; }
        .heart-top { 
            z-index: 2; 
            transform-origin: top center;
        }

        .interactive-heart.open .heart-top {
            transform: rotateX(-120deg);
            opacity: 0.8;
        }

        .click-hint {
            background: #ffffff;
            color: #e91e63;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(233,30,99,0.25);
            white-space: nowrap;
            border: 1px solid #f8bbd0;
        }

        /* النافذة المنبثقة للرسالة */
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; padding: 20px; z-index: 100; backdrop-filter: blur(5px); }
        .popup-content { background: #fff; padding: 30px 20px; border-radius: 25px; max-width: 380px; width: 100%; box-shadow: 0 15px 35px rgba(233,30,99,0.2); animation: popIn 0.4s ease; border: 2px solid #f8bbd0; }
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .day-badge { background: #ffe4e1; color: #e91e63; font-weight: bold; padding: 6px 18px; border-radius: 15px; display: inline-block; margin-bottom: 15px; font-size: 0.9rem; }
        .popup-text { font-size: 1.1rem; line-height: 1.8; color: #333; margin-bottom: 25px; white-space: pre-line; }
        .close-btn { background: #e91e63; color: white; border: none; padding: 10px 30px; border-radius: 20px; font-size: 1rem; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(233,30,99,0.3); }
    </style>
</head>
<body>

<div class="container">
    <p style="color: #999; font-size: 0.9rem;">إلى الشخص الذي يعني لي الكثير</p>
    <h1>برطمان الرسائل</h1>
    <p class="subtitle">اضغط على البرطمان لهزه واستخراج بيت اليوم...</p>

    <!-- القلب المستخرج -->
    <div class="popped-container" id="poppedContainer" onclick="openHeartEnvelope()">
        <div class="interactive-heart" id="interactiveHeart">
            <div class="heart-layer heart-base">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <path d="M50,88 C20,65 5,45 5,28 C5,12 18,3 32,3 C41,3 47,8 50,14 C53,8 59,3 68,3 C82,3 95,12 95,28 C95,45 80,65 50,88 Z" fill="#c2185b"/>
                </svg>
            </div>
            <div class="heart-layer heart-top">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <path d="M50,88 C20,65 5,45 5,28 C5,12 18,3 32,3 C41,3 47,8 50,14 C53,8 59,3 68,3 C82,3 95,12 95,28 C95,45 80,65 50,88 Z" fill="#e91e63"/>
                    <path d="M50,14 L50,88" stroke="#f8bbd0" stroke-width="2" opacity="0.5"/>
                </svg>
            </div>
        </div>
        <div class="click-hint">افتح القلب لقراءة البيت</div>
    </div>

    <!-- البرطمان الزجاجي -->
    <div class="jar-wrapper" id="jarWrapper" onclick="handleJarClick()">
        <div class="jar-cap"></div>
        <div class="glass-jar">
            <div class="glass-shine"></div>
            <div class="jar-contents" id="jarContents"></div>
        </div>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        <div class="day-badge" id="day-badge">بيت اليوم</div>
        <p class="popup-text" id="message-text"></p>
        <button class="close-btn" onclick="closeMessage()">إغلاق</button>
    </div>
</div>

<script>
    // 20 بيت شعر غزل لشعراء بصيغة المذكر
    const messages = [
        "اليوم الأول:\nوَمَا كُنْتُ مِمَّنْ يَدْخُلُ الْعِشْقُ قَلْبَهُ\nوَلَكِنَّ مَنْ يُبْصِرْ جُفُونَكَ يَعْشَقِ\n\n— المتنبي",
        "اليوم الثاني:\nيَقُولُونَ لِي زِدْتَ اشْتِيَاقاً وَلَوْعَةً\nفَقُلْتُ وَهَلْ يَخْلُو مِنَ الشَّوْقِ مَنْ يَهُوَى؟\n\n— ابن الفارض",
        "اليوم الثالث:\nأَرَاكَ فَتَطِيبُ نَفْسِي وَيَزُولُ هَمِّي\nكَأَنَّكَ لِلرُّوحِ الْمَرِيضَةِ بَلْسَمُ\n\n— البحتري",
        "اليوم الرابع:\nوَلَقَدْ ذَكَرْتُكَ وَالرِّمَاحُ نَوَاهِلٌ\nمِنِّي وَبِيضُ الْهِنْدِ تَقْطُرُ مِنْ دَمِي\n\n— عنترة بن شداد",
        "اليوم الخامس:\nوَإِنِّي لَأَهْوَى النَّوْمَ فِي غَيْرِ حِينِهِ\nلَعَلَّ لِقَاءً فِي الْمَنَامِ يَكُونُ\n\n— قيس بن الملوح",
        "اليوم السادس:\nأَنْتَ المُنَى وَحَبِيبُ العُمْرِ كُلِّهِ\nوَبِغَيْرِ قُرْبِكَ لا تَطِيبُ الحَيَاةُ\n\n— نزار قباني",
        "اليوم السابع:\nفَلَيْتَكَ تَحْلُو وَالْحَيَاةُ مَرِيرَةٌ\nوَلَيْتَكَ تَرْضَى وَالأَنَامُ غِضَابُ\n\n— أبو فراس الحمداني",
        "اليوم الثامن:\nيَا نَاعِسَ الطَّرْفِ كَمْ شَوْقاً يُؤَرِّقُنِي\nوَفِي فُؤَادِي لَهِيبٌ لَيْسَ يَطْفَئُهُ\n\n— أحمد شوقي",
        "اليوم التاسع:\nوَإِذَا نَظَرْتُ إِلَى عُيُونِكَ لَمْ أَجِدْ\nإِلَّا الأَمَانَ وَمَا تَمَنَّتْ رُوحِيَا\n\n— فاروق جويدة",
        "اليوم العاشر:\nأَحَبَّكَ قَلْبِي وَالحَيَاةُ جَمِيلَةٌ\nبِقُرْبِكَ يَا مَنْ لا أَرَى غَيْرَهُ حُبَّا\n\n— إيليا أبو ماضي",
        "اليوم الحادي عشر:\nفَإِنْ جِئْتَ زَادَتْ بِالحَيَاةِ بَهَاجَةٌ\nوَإِنْ غِبْتَ صَارَتْ كُلُّ دُنْيَايَ ظَلْمَاءَ\n\n— ابن زيدون",
        "اليوم الثاني عشر:\nوَيَسْأَلُونَنِي عَنْكَ وَفِي قَلْبِي غَرَامٌ\nكَأَنَّكَ القَلْبُ وَالقَلْبُ المَنَامُ\n\n— الشاب الظريف",
        "اليوم الثالث عشر:\nسَأَلْتُ الرِّيحَ عَنْكَ لَعَلَّ رِيحاً\nتَجِيءُ بِرِيحِ مَنْ أَهْوَى جَمِيلًا\n\n— العباس بن الأحنف",
        "اليوم الرابع عشر:\nيَا بَهْجَةَ الرُّوحِ يَا سِرَّ السَّعَادَةِ فِي\nدُنْيَا تَمَلَّأُ بِالأَحْزَانِ وَالهَمِّ\n\n— خليل مطران",
        "اليوم الخامس عشر:\nوَقَدْ أَمُوتُ شَوْقاً وَلا أَرَاكَ\nوَلَكِنَّ الشَّوْقَ يَظَلُّ حَيّاً فِي قَلْبِي\n\n— قيس بن ذريح",
        "اليوم السادس عشر:\nلو كُنتُ أعلَمُ أنَّ الحُبَّ يَقتُلُنِي\nلَأَعدَدْتُ لِي قَبلَ اللِّقَاءِ كَفَنَا\n\n— جميل بثينة",
        "اليوم السابع عشر:\nوَإِنِّي لَأَسْتَغْشِي وَمَا بِيَ نَعْسَةٌ\nلَعَلَّ خَيَالاً مِنْكَ يَلْقَى خَيَالِيَا\n\n— جميل بثينة",
        "اليوم الثامن عشر:\nفَمَا كُلُّ مَنْ تَهْوَاهُ يَهْوَاكَ قَلْبُهُ\nوَلا كُلُّ مَنْ صَافَيْتَهُ لَكَ قَدْ صَفَا\n\n— الشافعي",
        "اليوم التاسع عشر:\nتَرَكْتُ حَبِيبِي لَيْسَ عَنْ قِلًى وَإِنَّمَا\nعَنِ الذَّنْبِ إِذْ أَمْسَى يُشَارِكُهُ القَلْبُ\n\n— الشريف الرضي",
        "اليوم العشرين:\nخِتَامُهَا مِسْكٌ وَأَنْتَ المِسْكُ كُلُّهُ\nدُمْتَ لِي شَيْئاً جَمِيلاً لا يَنْتَهِي\n\n— الحلاج"
    ];

    const redShades = ['#e91e63', '#d81b60', '#c2185b', '#f44336', '#e53935', '#d32f2f', '#ff1744'];

    function createHeartSVG(color, size) {
        return `
        <svg class="stacked-heart" style="width:${size}px; height:${size}px;" viewBox="0 0 100 100">
            <path d="M50,88 C20,65 5,45 5,28 C5,12 18,3 32,3 C41,3 47,8 50,14 C53,8 59,3 68,3 C82,3 95,12 95,28 C95,45 80,65 50,88 Z" fill="${color}"/>
            <path d="M30,15 C20,15 12,22 12,32" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" fill="none"/>
        </svg>`;
    }

    const jarContents = document.getElementById('jarContents');
    const totalHearts = 65;

    for (let i = 0; i < totalHearts; i++) {
        const color = redShades[Math.floor(Math.random() * redShades.length)];
        const size = Math.floor(Math.random() * 12) + 32; 
        
        const wrapper = document.createElement('div');
        wrapper.innerHTML = createHeartSVG(color, size);
        const heart = wrapper.firstElementChild;

        const bottomPos = Math.random() * 85; 
        const leftPos = Math.random() * 75 + 5; 
        const rotation = Math.random() * 80 - 40; 

        heart.style.bottom = `${bottomPos}%`;
        heart.style.left = `${leftPos}%`;
        heart.style.transform = `rotate(${rotation}deg)`;
        heart.style.zIndex = Math.floor(bottomPos);

        jarContents.appendChild(heart);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSoftChime() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.3);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
    }

    // المنطق الجديد: الاعتماد على أول تاريخ يفتح فيه المتصفح الخاص بالمستلم الرابط
    const todayStr = new Date().toDateString();
    let userStartDate = localStorage.getItem('user_first_visit_date');

    if (!userStartDate) {
        // تسجيل تاريخ أول فتح للموقع في متصفحه الخاص
        userStartDate = todayStr;
        localStorage.setItem('user_first_visit_date', userStartDate);
    }

    const firstDate = new Date(userStartDate).getTime();
    const today = new Date(todayStr).getTime();
    
    let diffDays = Math.floor((today - firstDate) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) diffDays = 0;
    
    let currentDay = (diffDays % messages.length) + 1;

    function handleJarClick() {
        const jarWrapper = document.getElementById('jarWrapper');
        const poppedContainer = document.getElementById('poppedContainer');
        const interactiveHeart = document.getElementById('interactiveHeart');
        
        interactiveHeart.classList.remove('open');
        poppedContainer.classList.remove('show');
        
        jarWrapper.classList.add('shake-jar');
        playSoftChime();

        const hearts = document.querySelectorAll('.stacked-heart');
        hearts.forEach(h => {
            const currentRot = h.style.transform;
            h.style.transform = `${currentRot} translateY(-4px)`;
            setTimeout(() => {
                h.style.transform = currentRot;
            }, 200);
        });

        setTimeout(() => {
            jarWrapper.classList.remove('shake-jar');
            poppedContainer.classList.add('show');
        }, 500);
    }

    function openHeartEnvelope() {
        playSoftChime();
        const interactiveHeart = document.getElementById('interactiveHeart');
        interactiveHeart.classList.add('open');

        setTimeout(() => {
            document.getElementById('poppedContainer').classList.remove('show');
            document.getElementById('day-badge').innerText = "بيت اليوم " + currentDay;
            document.getElementById('message-text').innerText = messages[currentDay - 1];
            document.getElementById('popup').style.display = 'flex';
        }, 400);
    }

    function closeMessage() {
        document.getElementById('popup').style.display = 'none';
    }
</script>

</body>
</html>
